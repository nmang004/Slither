name: Release

on:
  push:
    tags:
      - "v*"

# Third-party actions are pinned by commit SHA rather than a mutable tag; the
# trailing comment records the tag each SHA corresponds to. Write access is
# granted per job rather than workflow-wide, so the build matrix (which
# compiles third-party code) runs read-only.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # musl, not gnu: a glibc build links against the runner's glibc and
          # refuses to start on any distro older than it ("GLIBC_2.39 not
          # found"). musl links statically, so one Linux binary runs anywhere.
          # Viable here because reqwest uses rustls rather than native-tls, so
          # nothing needs a system OpenSSL.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # rusqlite is vendored ("bundled"), so the musl target needs a musl C
      # compiler to build SQLite from source.
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked so the published binary is built from the committed lockfile
      # and not a silently newer dependency graph.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p slither-cli

      # Artifact name matches install.sh: slither-<tag>-<name> (tag is v-prefixed).
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN="slither-${GITHUB_REF_NAME}-${{ matrix.name }}"
          cp "target/${{ matrix.target }}/release/slither" "$BIN"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          BIN="slither-${GITHUB_REF_NAME}-${{ matrix.name }}.exe"
          cp "target/${{ matrix.target }}/release/slither.exe" "$BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slither-${{ matrix.name }}
          path: slither-${{ github.ref_name }}-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          merge-multiple: true

      # SHA256SUMS lists each artifact by its bare filename, which is what
      # install.sh looks up for verification.
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum slither-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/slither-*
            artifacts/SHA256SUMS
          generate_release_notes: true
