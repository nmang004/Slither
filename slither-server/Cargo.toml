[package]
name = "slither-server"
version = "0.3.0"
edition = "2021"
description = "REST API and MCP server for Slither, the SEO toolkit made for Scorpion"
license = "MIT"

[lib]
name = "slither_server"
path = "src/lib.rs"

[[bin]]
name = "slither-server"
path = "src/main.rs"

[features]
default = []
cloudflare = ["slither-core/cloudflare"]

[dependencies]
slither-core = { path = "../slither-core", default-features = false }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
http = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
