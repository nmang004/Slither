<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">
            {{ mascot_svg | safe }}
            <div class="sidebar-brand-block">
                <span class="sidebar-brand">Slither</span>
                <span class="sidebar-tagline">for Scorpion</span>
            </div>
        </div>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-item active" onclick="switchTab('overview', this)" id="nav-overview">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>Overview</span>
        </div>
        <div class="nav-item" onclick="switchTab('issues', this)" id="nav-issues">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11" r="0.75" fill="currentColor"/></svg>
            <span>Issues</span>
            {% if total_issues > 0 %}<span class="nav-badge">{{ total_issues }}</span>{% endif %}
        </div>
        <div class="nav-item" onclick="switchTab('pages', this)" id="nav-pages">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="1.5" width="12" height="13" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M5 5h6M5 8h6M5 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Pages</span>
        </div>
        <div class="nav-item" onclick="switchTab('structure', this)" id="nav-structure">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3h4M6 3v4M6 7h4M10 7v4M10 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Structure</span>
        </div>
    </nav>
    <div class="sidebar-meta">
        <div class="meta-domain">{{ domain }}</div>
        <div class="meta-item">{{ total_pages }} pages</div>
        <div class="meta-item">{{ duration }} crawl</div>
        <div class="meta-item">{{ crawl_date }}</div>
        {% if backend == "cloudflare" %}
        <div class="meta-item" style="color: var(--accent-light, #5BB4D4);">&#9729; Cloudflare (JS rendered)</div>
        {% endif %}
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle color theme">
            <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
            <span>Theme</span>
        </button>
    </div>
</div>
